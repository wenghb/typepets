<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>TypePets — Progress Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
    .report-page { max-width: 900px; }
    .report-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .report-toolbar .btn-secondary { margin-left: 0; }
    .report-toolbar .spacer { flex: 1; }
    .report-toolbar label { font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
    .report-toolbar select, .report-toolbar input {
        font-family: var(--font-body); font-weight: 700; font-size: 0.88rem; padding: 7px 10px;
        border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-primary);
    }
    .r-card { background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px 22px; margin-bottom: 16px; break-inside: avoid; }
    .r-card h2 { font-size: 1.1rem; margin-bottom: 12px; }
    .r-header { display: flex; align-items: center; gap: 16px; }
    .r-header-avatar { font-size: 3rem; line-height: 1; }
    .r-header h1 { font-size: 1.6rem; margin-bottom: 2px; }
    .r-header-sub { color: var(--text-secondary); font-weight: 700; font-size: 0.9rem; }
    .r-brand { margin-left: auto; text-align: right; font-family: var(--font-display); font-weight: 700; color: var(--accent-blue); font-size: 1.05rem; }
    .r-brand small { display: block; font-family: var(--font-body); font-size: 0.72rem; color: var(--text-secondary); font-weight: 700; }
    .r-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .r-tile { background: var(--bg-primary); border-radius: var(--radius-md); padding: 12px; text-align: center; }
    .r-tile-value { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; color: var(--accent-blue); }
    .r-tile-label { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-secondary); }
    .r-trend { margin-top: 12px; font-size: 0.88rem; font-weight: 700; }
    .r-trend .up { color: #2F855A; }
    .r-trend .down { color: var(--accent-red); }
    .r-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .r-chart-title { font-size: 0.85rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 6px; }
    .report-chart { width: 100%; height: auto; display: block; }
    .report-chart .grid { stroke: var(--border-color); stroke-width: 1; }
    .report-chart .axis-label { fill: var(--text-secondary); font-size: 11px; font-family: var(--font-body); }
    .chart-empty { padding: 30px 10px; text-align: center; color: var(--text-secondary); font-weight: 600; font-size: 0.88rem; background: var(--bg-primary); border-radius: var(--radius-md); }
    .r-keys { display: flex; flex-wrap: wrap; gap: 8px; }
    .r-key { min-width: 54px; padding: 8px 10px; border-radius: var(--radius-sm); background: #FFF5F5; border: 1px solid #FED7D7; text-align: center; }
    [data-theme="dark"] .r-key { background: #3B2020; border-color: #5B3030; }
    .r-key-letter { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: var(--accent-red); }
    .r-key-count { font-size: 0.68rem; font-weight: 700; color: var(--accent-red); }
    .r-note { font-size: 0.8rem; color: var(--text-secondary); margin-top: 10px; line-height: 1.5; }
    .r-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .r-table th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-secondary); padding: 6px 8px; border-bottom: 2px solid var(--border-color); }
    .r-table td { padding: 7px 8px; border-bottom: 1px solid var(--border-color); }
    .r-table .muted { color: var(--text-secondary); }
    .r-table a { color: var(--accent-blue); font-weight: 700; }
    .r-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .r-chip { padding: 4px 10px; border-radius: 999px; background: var(--bg-primary); font-size: 0.8rem; font-weight: 700; }
    .r-chip.on { background: #E6FFFA; color: #276749; }
    [data-theme="dark"] .r-chip.on { background: #1C3B34; color: #9AE6B4; }
    .r-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .r-badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .r-badge { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg-primary); border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 700; }
    .r-badge-emoji { font-size: 1.4rem; }
    .r-badge small { display: block; color: var(--text-secondary); font-weight: 600; font-size: 0.7rem; }
    .r-footer { text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin: 18px 0 8px; }

    /* Certificate */
    .certificate {
        position: relative; max-width: 820px; margin: 0 auto; aspect-ratio: 1.414 / 1;
        background: #FFFDF7; color: #2D3748; border-radius: 12px; box-shadow: var(--shadow-md);
        padding: 22px; break-inside: avoid;
    }
    .certificate-inner {
        height: 100%; border: 3px solid #D4A843; outline: 1px solid #D4A843; outline-offset: -10px;
        border-radius: 8px; padding: 28px 36px; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; gap: 6px;
        background: radial-gradient(circle at 50% 0%, rgba(246, 194, 85, 0.14), transparent 60%);
    }
    .cert-emoji { font-size: 3rem; line-height: 1; }
    .cert-kicker { font-size: 0.8rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #B7791F; }
    .cert-title { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; color: #2B6CB0; }
    .cert-small { font-size: 0.95rem; color: #4A5568; font-weight: 600; }
    .cert-name { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; color: #2D3748; border-bottom: 2px solid #D4A843; padding: 0 24px 2px; margin: 4px 0; max-width: 100%; overflow-wrap: anywhere; }
    .cert-achievement { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; color: #2D3748; }
    .cert-detail { font-size: 1rem; font-weight: 700; color: #4A5568; }
    .cert-pet { font-size: 0.9rem; color: #4A5568; font-weight: 600; margin-top: 4px; }
    .cert-footer { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; margin-top: 18px; gap: 20px; }
    .cert-sign { flex: 1; text-align: center; font-size: 0.78rem; color: #718096; font-weight: 700; }
    .cert-sign-line { border-top: 1.5px solid #A0AEC0; padding-top: 4px; margin-top: 26px; }
    .cert-seal { font-size: 2.6rem; }
    .cert-brand { font-family: var(--font-display); color: #4A90D9; font-weight: 700; font-size: 0.9rem; margin-top: 8px; }
    .not-yet { max-width: 520px; margin: 30px auto; text-align: center; }
    .not-yet .cert-emoji { margin-bottom: 8px; }
    .not-yet p { color: var(--text-secondary); font-weight: 600; margin: 8px 0 16px; line-height: 1.5; }

    @media (max-width: 700px) {
        .r-tiles { grid-template-columns: repeat(2, 1fr); }
        .r-charts, .r-two { grid-template-columns: 1fr; }
        .r-header { flex-wrap: wrap; }
        .r-brand { margin-left: 0; text-align: left; width: 100%; }
        .certificate { aspect-ratio: auto; padding: 10px; }
        .certificate-inner { padding: 22px 14px; }
        .cert-title { font-size: 1.6rem; }
        .cert-name { font-size: 1.9rem; }
        .cert-achievement { font-size: 1.15rem; }
    }

    @media print {
        :root, [data-theme="dark"] {
            --bg-primary: #F5F7FA; --bg-card: #ffffff; --text-primary: #1A202C; --text-secondary: #4A5568;
            --border-color: #CBD5E0; --shadow-sm: none; --shadow-md: none;
        }
        body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .report-page { max-width: none; }
        .r-card { box-shadow: none; border: 1px solid #CBD5E0; padding: 12px 14px; margin-bottom: 10px; }
        .r-tiles { grid-template-columns: repeat(4, 1fr); }
        .r-charts, .r-two { grid-template-columns: 1fr 1fr; }
        .r-table a { color: inherit; text-decoration: none; }
        .cert-link { display: none; }
        .certificate { box-shadow: none; max-width: none; width: 100%; aspect-ratio: auto; height: 180mm; padding: 0; }
        .certificate-inner { padding: 24px 40px; }
    }
    </style>
</head>

        <a href="../" class="nav-logo"><span>🐾 TypePets</span></a>
        <div class="nav-links">
            <a href="training.html" class="nav-link">Training</a>
            <a href="bubbles.html" class="nav-link">Bubbles</a>
            <a href="articles.html" class="nav-link">Articles</a>

            <a href="dashboard.html" class="nav-link">Stats</a>
        </div>
        <div class="nav-right">
            <a href="https://buy.stripe.com/bJecN7fDM1eSeNigYH8EM00" target="_blank" rel="noopener" title="Support TypePets" class="donate-heart">💛 Support</a>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark/light theme">🌙</button>

    <main class="content report-page">
        <div class="report-toolbar no-print" id="toolbar"></div>
        <div id="reportRoot"></div>
    </main>

    <div id="toast-container"></div>

    <script src="../js/data.js"></script>
    <script src="../js/sound.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/achievements.js"></script>
    <script src="../js/articles-data.js"></script>
    <script>
    (function() {
        'use strict';

        const STAGE_NAMES = {
            1: 'Home Row', 2: 'Home Row Words', 3: 'Top Row', 4: 'Top + Home Words',
            5: 'Bottom Row', 6: 'All Letters', 7: 'Numbers', 8: 'Full Keyboard'
        };
        const EVOS = { egg: '🥚', baby: '🐣', kid: '🐥', teen: '🦊', adult: '🦅', master: '🐉' };
        const MODE_NAMES = { finger_training: 'Training', bubble_pop: 'Bubble Pop', article: 'Articles' };
        const params = new URLSearchParams(location.search);
        const toolbar = document.getElementById('toolbar');
        const root = document.getElementById('reportRoot');

        // ─── tiny DOM helpers (textContent only) ────────────
        function h(tag, props) {
            const el = document.createElement(tag);
            if (props) {
                Object.keys(props).forEach(k => {
                    const v = props[k];
                    if (v === null || v === undefined || v === false) return;
                    if (k === 'class') el.className = v;
                    else if (k === 'text') el.textContent = v;
                    else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
                    else el.setAttribute(k, v === true ? '' : v);
                });
            }
            for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
            return el;
        }
        function append(el, child) {
            if (child === null || child === undefined || child === false) return;
            if (Array.isArray(child)) { child.forEach(c => append(el, c)); return; }
            el.appendChild(typeof child === 'object' ? child : document.createTextNode(String(child)));
        }
        function svgEl(tag, attrs) {
            const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
            return el;
        }

        function parseLocal(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }
        function fmtDate(d, opts) {
            return d.toLocaleDateString(undefined, opts || { year: 'numeric', month: 'short', day: 'numeric' });
        }
        function avg(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
        function round1(v) { return Math.round(v * 10) / 10; }
        function minutesText(seconds) {
            const m = Math.round(seconds / 60);
            return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
        }
        function articleTitle(id) {
            if (typeof ARTICLES === 'undefined') return `Article ${id}`;
            const a = ARTICLES.find(x => String(x.id) === String(id));
            return a ? a.title : `Article ${id}`;
        }
        function sessionDate(s) {
            const t = Date.parse(s.timestamp);
            return isFinite(t) ? TypePetsData.localDateStr(t) : null;
        }
        function playerName() {
            return TypePetsData.getActiveProfile().name || TypePetsData.getUser().nickname || 'Player';
        }

        // ─── Charts (inline SVG, prints crisply) ────────────
        function lineChart(points, opts) {
            if (!points.length) return h('div', { class: 'chart-empty', text: 'No sessions in this period yet.' });
            const W = 600, H = 200, padL = 38, padR = 14, padT = 12, padB = 28;
            const cw = W - padL - padR, ch = H - padT - padB;
            const vals = points.map(p => p.value);
            let min = opts.min !== undefined ? opts.min : Math.max(0, Math.floor(Math.min(...vals) - 5));
            let max = opts.max !== undefined ? opts.max : Math.ceil(Math.max(...vals) + 5);
            if (max - min < 10) max = min + 10;
            const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'report-chart', role: 'img', 'aria-label': opts.label });
            for (let i = 0; i <= 4; i++) {
                const y = padT + (ch / 4) * i;
                svg.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: y, y2: y, class: 'grid' }));
                const t = svgEl('text', { x: padL - 6, y: y + 4, 'text-anchor': 'end', class: 'axis-label' });
                t.textContent = Math.round(max - ((max - min) / 4) * i);
                svg.appendChild(t);
            }
            const xy = points.map((p, i) => ({
                x: points.length === 1 ? padL + cw / 2 : padL + (i / (points.length - 1)) * cw,
                y: padT + ch - ((p.value - min) / (max - min)) * ch
            }));
            if (xy.length > 1) {
                svg.appendChild(svgEl('polyline', {
                    points: xy.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '),
                    fill: 'none', stroke: opts.color, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
                }));
            }
            if (xy.length <= 40) {
                xy.forEach(p => svg.appendChild(svgEl('circle', { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: 3.5, fill: '#fff', stroke: opts.color, 'stroke-width': 2 })));
            }
            const labelIdx = points.length === 1 ? [0] : [0, points.length - 1];
            labelIdx.forEach((i, n) => {
                const t = svgEl('text', { x: xy[i].x, y: H - 8, 'text-anchor': points.length === 1 ? 'middle' : (n === 0 ? 'start' : 'end'), class: 'axis-label' });
                t.textContent = fmtDate(parseLocal(points[i].date), { month: 'short', day: 'numeric' });
                svg.appendChild(t);
            });
            return svg;
        }

        // ─── Report ─────────────────────────────────────────
        function buildToolbar(extra) {
            toolbar.textContent = '';
            append(toolbar, h('a', { href: 'dashboard.html', class: 'btn btn-secondary', text: '← Back to stats' }));
            append(toolbar, extra);
            append(toolbar, h('span', { class: 'spacer' }));
            append(toolbar, h('button', { type: 'button', class: 'btn btn-primary', onclick: () => window.print(), text: '🖨️ Print' }));
        }

        function renderReport() {
            const rangeParam = params.get('range') || '30';
            const select = h('select', { id: 'rangeSelect', 'aria-label': 'Report period' },
                [['7', 'Last 7 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['all', 'All time']].map(([v, t]) => {
                    const o = h('option', { value: v, text: t });
                    if (v === rangeParam) o.selected = true;
                    return o;
                }));
            select.addEventListener('change', () => {
                params.set('range', select.value);
                history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
                draw(select.value);
            });
            buildToolbar(h('label', null, 'Period:', select));
            draw(select.value);
        }

        function draw(range) {
            root.textContent = '';
            const today = TypePetsData.localDateStr();
            const all = TypePetsData.getSessions(1000).slice().reverse(); // oldest first
            let startDate;
            if (range === 'all') {
                const first = all.length ? sessionDate(all[0]) : null;
                startDate = first && first < today ? first : today;
            } else {
                const d = parseLocal(today);
                d.setDate(d.getDate() - (parseInt(range, 10) - 1));
                startDate = TypePetsData.localDateStr(d);
            }
            const sessions = all.filter(s => { const d = sessionDate(s); return d && d >= startDate && d <= today; });
            const pet = TypePetsData.getPet();
            const profile = TypePetsData.getActiveProfile();
            const stats = TypePetsData.getStats();
            const streaks = TypePetsData.getStreaks();
            const goal = TypePetsData.getDailyGoal();

            // Header
            const periodText = `${fmtDate(parseLocal(startDate))} – ${fmtDate(parseLocal(today))}`;
            const petName = pet.name && pet.name !== 'Unnamed' ? pet.name : 'Unnamed pet';
            append(root, h('section', { class: 'r-card r-header' },
                h('div', { class: 'r-header-avatar', 'aria-hidden': 'true', text: profile.avatar }),
                h('div', null,
                    h('h1', { text: `${profile.name}'s typing report` }),
                    h('div', { class: 'r-header-sub', text: periodText }),
                    h('div', { class: 'r-header-sub', text: `Pet: ${EVOS[pet.species] || '🥚'} ${petName} · Level ${pet.level} · ${pet.xp.toLocaleString()} XP` })
                ),
                h('div', { class: 'r-brand' }, '🐾 TypePets', h('small', { text: 'Parent / teacher report' }))
            ));

            // Summary tiles
            const secs = sessions.reduce((a, s) => a + (s.duration_seconds || 0), 0);
            const days = new Set(sessions.map(sessionDate)).size;
            const wpms = sessions.filter(s => s.wpm > 0).map(s => s.wpm);
            const accs = sessions.filter(s => s.accuracy > 0).map(s => s.accuracy);
            const historyDays = Math.min(366, Math.max(1, Math.round((parseLocal(today) - parseLocal(startDate)) / 86400000) + 1));
            const goalDays = TypePetsData.getDailyHistory(historyDays).filter(d => d.goal_met).length;
            const tiles = [
                [sessions.length, 'Sessions'],
                [minutesText(secs), 'Practice time'],
                [days, 'Days practiced'],
                [`${goalDays}`, `Daily goals met (${goal.goal_minutes}m)`],
                [wpms.length ? round1(avg(wpms)) : '–', 'Avg WPM'],
                [wpms.length ? round1(Math.max(...wpms)) : '–', 'Best WPM'],
                [accs.length ? round1(avg(accs)) + '%' : '–', 'Avg accuracy'],
                [`${streaks.current_streak} / ${streaks.longest_streak}`, 'Streak now / best']
            ];
            const summary = h('section', { class: 'r-card' }, h('h2', { text: 'Summary' }),
                h('div', { class: 'r-tiles' }, tiles.map(([v, l]) => h('div', { class: 'r-tile' },
                    h('div', { class: 'r-tile-value', text: String(v) }), h('div', { class: 'r-tile-label', text: l })))));
            // Progress over the period: first vs latest sessions
            if (wpms.length >= 4) {
                const n = Math.min(5, Math.floor(wpms.length / 2));
                const firstW = avg(wpms.slice(0, n)), lastW = avg(wpms.slice(-n));
                const diffW = round1(lastW - firstW);
                const trend = h('div', { class: 'r-trend' }, `Speed: ${round1(firstW)} → ${round1(lastW)} WPM `,
                    h('span', { class: diffW >= 0 ? 'up' : 'down', text: `(${diffW >= 0 ? '+' : ''}${diffW})` }));
                if (accs.length >= 4) {
                    const m = Math.min(5, Math.floor(accs.length / 2));
                    const firstA = avg(accs.slice(0, m)), lastA = avg(accs.slice(-m));
                    const diffA = round1(lastA - firstA);
                    append(trend, ` · Accuracy: ${round1(firstA)}% → ${round1(lastA)}% `);
                    append(trend, h('span', { class: diffA >= 0 ? 'up' : 'down', text: `(${diffA >= 0 ? '+' : ''}${diffA})` }));
                }
                append(trend, h('span', { class: 'r-header-sub', text: ` — first ${n} vs latest ${n} sessions` }));
                append(summary, trend);
            }
            append(root, summary);

            // Trends by day
            const byDay = {};
            sessions.forEach(s => {
                const d = sessionDate(s);
                if (!byDay[d]) byDay[d] = { w: [], a: [] };
                if (s.wpm > 0) byDay[d].w.push(s.wpm);
                if (s.accuracy > 0) byDay[d].a.push(s.accuracy);
            });
            const dates = Object.keys(byDay).sort();
            const wpmPts = dates.filter(d => byDay[d].w.length).map(d => ({ date: d, value: avg(byDay[d].w) }));
            const accPts = dates.filter(d => byDay[d].a.length).map(d => ({ date: d, value: avg(byDay[d].a) }));
            append(root, h('section', { class: 'r-card' }, h('h2', { text: 'Speed & accuracy by day' }),
                h('div', { class: 'r-charts' },
                    h('div', null, h('div', { class: 'r-chart-title', text: 'Words per minute (daily average)' }),
                        lineChart(wpmPts, { color: '#4A90D9', label: 'Words per minute by day' })),
                    h('div', null, h('div', { class: 'r-chart-title', text: 'Accuracy % (daily average)' }),
                        lineChart(accPts, { color: '#38A169', min: Math.max(0, Math.floor(Math.min(100, ...accPts.map(p => p.value)) / 10) * 10 - 10), max: 100, label: 'Accuracy by day' }))
                ),
                h('p', { class: 'r-note', text: 'WPM = correctly typed characters ÷ 5, per minute of active typing. Accuracy = correct keys ÷ all keys pressed.' })
            ));

            // Weakest keys + practice mix
            const weak = TypePetsData.getWeakness(sessions).weak_keys.slice(0, 8);
            const mix = {};
            sessions.forEach(s => { const k = MODE_NAMES[s.mode] || s.mode; mix[k] = (mix[k] || 0) + (s.duration_seconds || 0); });
            const keyLabel = k => k === ' ' ? 'SPACE' : String(k).toUpperCase();
            append(root, h('div', { class: 'r-two' },
                h('section', { class: 'r-card' }, h('h2', { text: 'Keys to practice' }),
                    weak.length
                        ? [h('div', { class: 'r-keys' }, weak.map(([k, c]) => h('div', { class: 'r-key' },
                              h('div', { class: 'r-key-letter', text: keyLabel(k) }), h('div', { class: 'r-key-count', text: `${c} miss${c === 1 ? '' : 'es'}` })))),
                           h('p', { class: 'r-note', text: `Tip: slow down on ${weak.slice(0, 3).map(([k]) => keyLabel(k)).join(', ')} and use the right finger — accuracy first, speed follows.` })]
                        : h('p', { class: 'r-note', text: 'No mistakes recorded in this period. 🎯' })),
                h('section', { class: 'r-card' }, h('h2', { text: 'Practice mix' }),
                    Object.keys(mix).length
                        ? h('table', { class: 'r-table' },
                            h('tbody', null, Object.entries(mix).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
                                h('tr', null, h('td', { text: k }), h('td', { class: 'muted', text: minutesText(v) })))))
                        : h('p', { class: 'r-note', text: 'No sessions in this period yet.' }))
            ));

            // Training stages
            const tp = TypePetsData.getTrainingProgress();
            const stageRows = Object.keys(STAGE_NAMES).map(id => {
                const st = tp.stages[id] || {};
                const stars = st.stars || 0;
                return h('tr', null,
                    h('td', { text: `${id}. ${STAGE_NAMES[id]}` }),
                    h('td', { text: stars ? '⭐'.repeat(stars) + '☆'.repeat(3 - stars) : (st.unlocked ? 'unlocked' : '🔒') , class: stars ? null : 'muted' }),
                    h('td', { class: 'muted', text: st.bestAccuracy ? `${st.bestAccuracy}%` : '–' }),
                    h('td', { class: 'cert-link' }, stars ? h('a', { href: `report.html?cert=training&stage=${id}`, text: '🎓 Certificate' }) : '')
                );
            });
            append(root, h('section', { class: 'r-card' }, h('h2', { text: 'Finger training' }),
                h('table', { class: 'r-table' },
                    h('thead', null, h('tr', null, h('th', { text: 'Stage' }), h('th', { text: 'Stars' }), h('th', { text: 'Best accuracy' }), h('th', { class: 'cert-link', text: '' }))),
                    h('tbody', null, stageRows))));

            // Bubbles + articles
            const passed = new Set(TypePetsData.getBubblePassedLevels());
            const bubble = TypePetsData.getBubbleLevel();
            const levels = [];
            for (let l = 1; l <= 20; l++) {
                const on = passed.has(l);
                levels.push(on
                    ? h('a', { class: 'r-chip on', href: `report.html?cert=bubbles&level=${l}`, title: `Certificate for level ${l}`, text: `✓ ${l}` })
                    : h('span', { class: 'r-chip', text: String(l) }));
            }
            const completed = TypePetsData.getCompletedArticles();
            append(root, h('div', { class: 'r-two' },
                h('section', { class: 'r-card' }, h('h2', { text: 'Bubble Pop levels passed' }),
                    h('div', { class: 'r-chips' }, levels),
                    h('p', { class: 'r-note', text: `${passed.size} of 20 passed · ${bubble.max_level > 20 ? 'Free Play unlocked' : `highest unlocked: level ${bubble.max_level}`} · best score: ${TypePetsData.getBubblePersonalBest().toLocaleString()}` })),
                h('section', { class: 'r-card' }, h('h2', { text: `Articles typed (${completed.length})` }),
                    completed.length
                        ? h('table', { class: 'r-table' }, h('tbody', null, completed.map(id => {
                            const b = TypePetsData.getArticleBest(id);
                            return h('tr', null,
                                h('td', null, h('a', { href: `report.html?cert=article&id=${encodeURIComponent(id)}`, text: articleTitle(id) })),
                                h('td', { class: 'muted', text: b.best_wpm ? `${Math.round(b.best_wpm)} WPM · ${Math.round(b.best_accuracy)}%` : '' }));
                        })))
                        : h('p', { class: 'r-note', text: 'No articles finished yet.' }))
            ));

            // Badges
            const earned = TypePetsData.getAchievements();
            const BAD = window.BADGES || {};
            append(root, h('section', { class: 'r-card' }, h('h2', { text: `Badges (${earned.length} of ${Object.keys(BAD).length})` }),
                earned.length
                    ? h('div', { class: 'r-badges' }, earned.map(a => {
                        const b = BAD[a.badge_id] || { emoji: '🏅', name: a.badge_id };
                        return h('div', { class: 'r-badge' }, h('span', { class: 'r-badge-emoji', text: b.emoji }),
                            h('span', null, b.name, h('small', { text: fmtDate(new Date(a.earned_at)) })));
                    }))
                    : h('p', { class: 'r-note', text: 'No badges yet — they come quickly with practice!' })));

            append(root, h('p', { class: 'r-footer', text: `Printed ${fmtDate(new Date())} · All TypePets data stays on this device · typepets.com` }));
            document.title = `TypePets — ${profile.name}'s report`;
        }

        // ─── Certificates ───────────────────────────────────
        function certificateFor(kind) {
            const name = playerName();
            if (kind === 'training') {
                const n = parseInt(params.get('stage'), 10);
                if (!STAGE_NAMES[n]) return null;
                const st = TypePetsData.getTrainingProgress().stages[n] || {};
                const earnedSession = TypePetsData.getSessions(1000).slice().reverse()
                    .find(s => s.mode === 'finger_training' && Number(s.level) === n && s.accuracy >= 85);
                if (!(st.stars >= 1)) {
                    return { ok: false, name, what: `Training Stage ${n}: ${STAGE_NAMES[n]}`, href: `training.html?stage=${n}`, cta: `Practice Stage ${n} →`,
                        hint: 'Finish the stage with at least 85% accuracy to earn a star — then come back for your certificate!' };
                }
                return { ok: true, name, emoji: '⌨️', achievement: `Finger Training Stage ${n}: ${STAGE_NAMES[n]}`,
                    detail: `${'⭐'.repeat(st.stars)}${'☆'.repeat(3 - st.stars)} · ${st.bestAccuracy}% best accuracy`,
                    date: earnedSession ? new Date(earnedSession.timestamp) : null };
            }
            if (kind === 'bubbles') {
                const n = parseInt(params.get('level'), 10);
                if (!(n >= 1 && n <= 20)) return null;
                if (!TypePetsData.getBubblePassedLevels().includes(n)) {
                    return { ok: false, name, what: `Bubble Pop Level ${n}`, href: 'bubbles.html', cta: 'Play Bubble Pop →',
                        hint: 'Pass the level to earn this certificate.' };
                }
                const s = TypePetsData.getSessions(1000).find(x => x.mode === 'bubble_pop' && Number(x.level) === n && x.passed === true);
                const detail = s ? `${Math.round(s.accuracy)}% accuracy · score ${Number(s.score || 0).toLocaleString()}` : 'Level passed';
                return { ok: true, name, emoji: '🫧', achievement: `Bubble Pop Level ${n}`, detail, date: s ? new Date(s.timestamp) : null };
            }
            if (kind === 'article') {
                const id = params.get('id');
                if (!id) return null;
                const done = TypePetsData.getCompletedArticles().some(x => String(x) === String(id));
                const title = articleTitle(id);
                if (!done) {
                    return { ok: false, name, what: `the article “${title}”`, href: `articles.html?article=${encodeURIComponent(id)}`, cta: 'Type this article →',
                        hint: 'Type the whole article to earn this certificate.' };
                }
                const b = TypePetsData.getArticleBest(id);
                const s = TypePetsData.getSessions(1000).find(x => x.mode === 'article' && String(x.level) === String(id));
                return { ok: true, name, emoji: '📖', achievement: `Typed the article “${title}”`,
                    detail: b.best_wpm ? `${Math.round(b.best_wpm)} WPM · ${Math.round(b.best_accuracy)}% accuracy` : 'Article completed',
                    date: s ? new Date(s.timestamp) : null };
            }
            return null;
        }

        function renderCertificate(kind) {
            const cert = certificateFor(kind);
            if (!cert) {
                buildToolbar(null);
                append(root, h('div', { class: 'r-card not-yet' },
                    h('div', { class: 'cert-emoji', text: '🤔' }),
                    h('h2', { text: "We couldn't find that certificate" }),
                    h('p', { text: 'The link might be incomplete.' }),
                    h('a', { class: 'btn btn-primary', href: 'report.html', text: 'See the full report' })));
                return;
            }
            if (!cert.ok) {
                buildToolbar(null);
                append(root, h('div', { class: 'r-card not-yet' },
                    h('div', { class: 'cert-emoji', text: '🌱' }),
                    h('h2', { text: 'Not yet — but soon!' }),
                    h('p', { text: `${cert.name} hasn't earned the certificate for ${cert.what} yet. ${cert.hint}` }),
                    h('a', { class: 'btn btn-primary', href: cert.href, text: cert.cta })));
                return;
            }

            // Landscape page for certificates
            const pageStyle = document.createElement('style');
            pageStyle.textContent = '@page { size: landscape; margin: 10mm; }';
            document.head.appendChild(pageStyle);

            const pet = TypePetsData.getPet();
            const nameEl = h('div', { class: 'cert-name', text: cert.name });
            const nameInput = h('input', { type: 'text', maxlength: '40', value: cert.name, 'aria-label': 'Name on certificate' });
            nameInput.addEventListener('input', () => { nameEl.textContent = nameInput.value.trim() || cert.name; });
            buildToolbar(h('label', null, 'Name on certificate:', nameInput));

            const dateText = fmtDate(cert.date || new Date(), { year: 'numeric', month: 'long', day: 'numeric' });
            const petLine = pet.name && pet.name !== 'Unnamed'
                ? `${EVOS[pet.species] || '🥚'} ${pet.name} the pet cheered all the way!`
                : `${EVOS[pet.species] || '🥚'} Your TypePets pet is proud of you!`;
            append(root, h('div', { class: 'certificate' },
                h('div', { class: 'certificate-inner' },
                    h('div', { class: 'cert-emoji', 'aria-hidden': 'true', text: cert.emoji }),
                    h('div', { class: 'cert-kicker', text: 'TypePets' }),
                    h('div', { class: 'cert-title', text: 'Certificate of Achievement' }),
                    h('div', { class: 'cert-small', text: 'This certifies that' }),
                    nameEl,
                    h('div', { class: 'cert-small', text: 'has successfully completed' }),
                    h('div', { class: 'cert-achievement', text: cert.achievement }),
                    h('div', { class: 'cert-detail', text: cert.detail }),
                    h('div', { class: 'cert-pet', text: petLine }),
                    h('div', { class: 'cert-footer' },
                        h('div', { class: 'cert-sign' }, h('div', { text: dateText }), h('div', { class: 'cert-sign-line', text: 'Date' })),
                        h('div', { class: 'cert-seal', 'aria-hidden': 'true', text: '🏅' }),
                        h('div', { class: 'cert-sign' }, h('div', { text: ' ' }), h('div', { class: 'cert-sign-line', text: 'Teacher / parent' }))),
                    h('div', { class: 'cert-brand', text: '🐾 typepets.com' }))));
            document.title = `TypePets — Certificate for ${cert.name}`;
        }

        const certKind = params.get('cert');
        if (certKind) renderCertificate(certKind);
        else renderReport();
    })();
    </script>
</body>
</html>
